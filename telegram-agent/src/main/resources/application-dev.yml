server:
  port: 8072

spring:
  application:
    name: telegram-agent

  liquibase:
    enabled: false
#    change-log: classpath:db/changelog/db.changelog-master.yml

  cloud:
    openfeign:
      retry:
        enabled: true

resilience4j:
  retry:
    instances:
      getMessageFromTelegramAgent:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        failAfterMaxAttempts: true

      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        failAfterMaxAttempts: true


  ratelimiter:
    instances:
      getMessageFromTelegramAgent:
        limitForPeriod: 10
        limitRefreshPeriod: 2s
        timeoutDuration: 0s

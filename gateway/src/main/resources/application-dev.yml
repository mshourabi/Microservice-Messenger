application:
  title: Messenger Gate Way
  version: 0.0.1-snapshot

server:
  port: 8070

management:
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        include: "*"
#        exclude: "*"

spring:
  cloud:
    gateway:
      server:
        webflux:

          routes:
            - id: distributor-service
              uri: http://localhost:8071
              predicates:
                - Path=/api/v1/messages/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    methods: GET    # Just on idempotent methods
                    series: SERVER_ERROR
                    exceptions:
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1s
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    name: distributorCircuitBreaker
                    fallbackUri: forward:/fallback/distributor


resilience4j:

  timelimiter:
    instances:
      distributorCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true

  circuitbreaker:
    instances:
      distributorCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 5
        failureRateThreshold: 50  # 50%
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

services:
  distributor:
    url: http://localhost:8071

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    k8sObject: gateway-deployment-lbl
spec:
  replicas: 1

  selector:
    matchLabels:
      app:  gateway-pod-lbl

  template:
    metadata:
      labels:
        app: gateway-pod-lbl

    spec:
      containers:
        - name:  gateway-app
          image: gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080


services:

  # =========================
  # Kafka
  # =========================

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # =========================
  # Kafka init
  # =========================

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -c
      - |
        echo "Waiting for Kafka..."

        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list > /dev/null 2>&1
        do
          echo "Kafka is not ready yet..."
          sleep 2
        done

        echo "Kafka is ready."

        echo "Creating TELEGRAM_AYSNC_MESSAGE..."

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic TELEGRAM_AYSNC_MESSAGE \
          --partitions 3 \
          --replication-factor 1

        echo "Current topics:"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list

        echo "Kafka initialization completed."
  # =========================
  # Kafka Connect + Debezium
  # =========================
  debezium:
    image: quay.io/debezium/connect:3.3
    container_name: debezium
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

  # =========================
  # Postgresql
  # =========================
  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
#    volumes:
#      - postgres_data:/var/lib/postgresql

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # =========================
  # kafka-ui
  # =========================

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
#    volumes:
#      - ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml

  # =========================
  # keycloak-db
  # =========================

  keycloak-db:
    image: postgres:18
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
#    volumes:
#      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # =========================
  # keycloak
  # =========================

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    depends_on:
      - keycloak-db
    restart: unless-stopped

#volumes:
#  postgres_data:

  # =========================
  # Alloy
  # =========================

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki


  # =========================
  # Loki
  # =========================
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
#      - loki-data:/loki
    command:
      - -config.file=/etc/loki/config.yml

#
#volumes:
#  loki-data:
#  alloy-data:

  # =========================
  # Grafana
  # =========================

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3040:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - loki


  # =========================
  # Prometheus
  # =========================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
#    depends_on:
#      - gateway
#      - distributor
#      - telegram-sender

  # =========================
  # Tempo
  # =========================

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    command:
      - "-config.file=/etc/tempo.yml"
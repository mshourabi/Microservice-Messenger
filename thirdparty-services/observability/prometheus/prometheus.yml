global:
  scrape_interval: 15s

scrape_configs:

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8070

  - job_name: distributor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8071

  - job_name: telegram-sender
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8072
databaseChangeLog:

  - changeSet:
      id: 001-create-message-sender
      author: majid

      changes:

        - createTable:
            tableName: tbl_message_sender
            columns:

              - column:
                  name: message_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_messagesender_messageid

              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_messagesender_senderid

              - column:
                  name: sender_order
                  type: INT
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_messagesender_order

        - addPrimaryKey:
            tableName: tbl_message_sender
            columnNames: message_id, sender_id
            constraintName: pk_message_sender

        - addForeignKeyConstraint:
            baseTableName: tbl_message_sender
            baseColumnNames: message_id
            referencedTableName: tbl_message
            referencedColumnNames: id
            constraintName: fk_messagesender_messageid

        - addForeignKeyConstraint:
            baseTableName: tbl_message_sender
            baseColumnNames: sender_id
            referencedTableName: tbl_sender
            referencedColumnNames: id
            constraintName: fk_messagesender_senderid
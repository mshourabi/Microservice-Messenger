databaseChangeLog:

  - changeSet:
      id: 001-create-sender
      author: majid
      changes:

        - createTable:
            tableName: tbl_sender
            columns:

              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sender_id
                    nullable: false
                    notNullConstraintName: nn_sender_id

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_sender_name
                    unique: true
                    uniqueConstraintName: uk_sender_name

              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_sender_active

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_sender_created

              - column:
                  name: last_modified_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    notNullConstraintName: nn_sender_lastmodify